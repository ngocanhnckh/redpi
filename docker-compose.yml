services:
  yitec-pi-vault:
    build: .
    container_name: yitec-pi-vault
    restart: unless-stopped
    environment:
      YITEC_VAULT_PORT: "7979"
      YITEC_VAULT_HOST: "0.0.0.0"
      # Set in .env before exposing through Cloudflare Tunnel.
      YITEC_VAULT_TOKEN: "${YITEC_VAULT_TOKEN:-change-me-long-random-token}"
      YITEC_VAULT_PASSWORD: "${YITEC_VAULT_PASSWORD:-change-me-vault-password}"
      PI_CODING_AGENT_DIR: "/data/pi-agent"
    ports:
      # Bound to localhost only. Cloudflare Tunnel can point to http://127.0.0.1:7979
      - "127.0.0.1:7979:7979"
    volumes:
      - yitec-pi-agent:/data/pi-agent

volumes:
  yitec-pi-agent:
