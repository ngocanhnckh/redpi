<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedPi HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/static/hq.css">
<style>
  .project { margin-bottom: 22px; }
  .project > .section-title { margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; }
  .runs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .run-card { display: block; padding: 14px; color: inherit; }
  .run-card:hover { border-color: var(--green-dim); text-decoration: none; }
  .run-card .t { font-weight: 600; margin: 6px 0 10px; }
  .bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--green); }
  .run-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
  .run-head h1 { font-size: 20px; }
  /* The dashboard uses the full screen width with a slim gutter (other HQ pages keep the reading width). */
  .wrap { max-width: none; padding: 10px 12px 16px; }
  .top { padding: 8px 12px; }
  .stats { gap: 10px; }
  .stat { padding: 8px 12px; } .stat .v { font-size: 19px; }
  .view-panel .panel-body { padding: 8px; }
  .run-head h1 { margin: 0; font-size: 22px; }
  /* Run page: the view (office, board, timeline, stats) with the event board beside it, the team below.
     The view area has a fixed height, so switching views (by hand or auto-play) never shifts the page. */
  #view-body { height: min(72vh, 860px); overflow: auto; transition: opacity .25s ease; }
  #view-body.fading { opacity: 0; }
  #view-body > .office-host { height: 100%; }
  .view-panel .panel-head { flex-wrap: wrap; row-gap: 6px; }
  #view-hint { flex: 1; min-width: 0; text-align: right; }
  @media (max-width: 640px) { #view-hint { display: none; } .viewtabs button { padding: 5px 8px; } .view-panel .panel-head { padding: 8px 10px; } }
  .autoplay { margin-left: auto; background: none; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .autoplay[aria-pressed="true"] { color: var(--green); border-color: var(--green-dim); background: var(--panel-2); }
  .ap-bar { height: 2px; background: var(--border); } .ap-bar i { display: block; height: 100%; width: 0; background: var(--green); }
  @keyframes ap-fill { from { width: 0; } to { width: 100%; } }
  /* Board cards stay compact: story line 1 row, title 3, note 3; the full text is on hover and in the card's history. */
  .card .id { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; line-clamp: 1; overflow: hidden; }
  .card .tt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  .card .note { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
  /* Timeline */
  .tl { display: grid; gap: 12px; }
  .tl-summary { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: end; justify-content: space-between; }
  .tl-overall { flex: 1 1 360px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; }
  .tl-big { font: 700 26px var(--mono); grid-row: span 2; }
  .tl-sum-text { font-size: 12px; color: var(--muted); }
  .pbar { height: 8px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border); overflow: hidden; } .pbar i { display: block; height: 100%; background: var(--green); }
  .tl-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .tl-legend .lg { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
  .lg.done { background: var(--green); } .lg.review { background: var(--amber); } .lg.in_progress { background: var(--cyan); } .lg.blocked { background: var(--red); } .lg.todo { background: var(--panel-2); border: 1px solid var(--faint); } .lg.crit { border: 2px solid var(--red); background: none; }
  .tl-grid { display: grid; }
  .tl-row { display: grid; grid-template-columns: minmax(180px, 34%) minmax(0, 1fr); min-height: 30px; align-items: center; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); }
  .tl-row.task { cursor: pointer; } .tl-row.task:hover, .tl-row.task:focus-visible { background: var(--panel-2); outline: none; }
  .tl-row.story { background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
  .tl-head { position: sticky; top: 0; z-index: 1; background: var(--panel); min-height: 24px; font-size: 11px; color: var(--muted); }
  .tl-label { padding: 4px 10px 4px 6px; font-size: 13px; min-width: 0; display: flex; gap: 6px; align-items: center; }
  .tl-row.story .tl-label { font-size: 13px; } .tl-row.task .tl-label { padding-left: 18px; }
  .tl-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-meta { margin-left: auto; font: 12px var(--mono); color: var(--muted); white-space: nowrap; padding-left: 8px; }
  .tl-who { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; } .tl-who .avatar.sm { width: 12px; height: 19px; }
  .tl-id { color: var(--muted); font-size: 12px; }
  .tl-track { position: relative; height: 100%; min-height: 24px; margin-right: 90px;
    background-image: linear-gradient(to right, color-mix(in srgb, var(--border) 70%, transparent) 1px, transparent 1px); background-size: var(--step) 100%; }
  .tl-head .tl-track { background: none; }
  .tl-tick { position: absolute; top: 5px; transform: translateX(2px); font-family: var(--mono); }
  .tl-bar { position: absolute; top: 50%; transform: translateY(-50%); height: 12px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--faint); overflow: hidden; }
  .tl-bar i { display: block; height: 100%; background: var(--cyan); }
  .tl-row.story .tl-bar { height: 8px; border-color: var(--green-dim); } .tl-row.story .tl-bar i { background: var(--green); }
  .st-done .tl-bar i { background: var(--green); } .st-review .tl-bar i { background: var(--amber); } .st-blocked .tl-bar { border-color: var(--red); } .st-blocked .tl-bar i { background: var(--red); }
  .st-in_progress .tl-bar i { background: repeating-linear-gradient(-45deg, var(--cyan) 0 6px, color-mix(in srgb, var(--cyan) 70%, var(--panel)) 6px 12px); background-size: 17px 17px; animation: tl-stripes 1s linear infinite; }
  @keyframes tl-stripes { to { background-position: 17px 0; } }
  @media (prefers-reduced-motion: reduce) { .st-in_progress .tl-bar i { animation: none; } #view-body { transition: none; } }
  .tl-row.crit .tl-bar { box-shadow: 0 0 0 1.5px var(--red); }
  .tl-pct { position: absolute; top: 50%; transform: translateY(-50%); font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .st-blocked .tl-pct { color: var(--red); } .st-done .tl-pct { color: var(--green); }
  .run-main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 10px; align-items: stretch; margin-bottom: 10px; }
  /* The event board takes the view's height (size containment keeps its long list out of the row height). */
  /* The event board fills the row the view sets: its content is positioned over the panel, so a long
     feed never makes the row taller (and nothing relies on size containment). */
  .feed-panel { position: relative; min-width: 0; min-height: 560px; }
  .feed-inner { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .feed-panel .chat-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* .chat.feed beats the older .chat rule below (a height-capped grid, whose rows collapsed long entries). */
  .chat.feed { flex: 1; min-height: 0; max-height: none; overflow-anchor: none; display: flex; flex-direction: column; gap: 6px; }
  .feed > *, .thread > * { flex: none; }   /* entries keep their full height; the list scrolls */
  .feed:empty::before { content: "No messages or actions yet."; color: var(--muted); font-size: 13px; }
  .feed.f-updates > :not(.upd):not(.move), .feed.f-chat > :not(.msg), .feed.f-tools > :not(.tool) { display: none; }
  /* An agent's own update: a readable line, set apart from chat bubbles and tool calls. */
  .upd { font-size: 13px; padding: 6px 9px; border-left: 3px solid var(--cyan); background: color-mix(in srgb, var(--cyan) 6%, transparent); border-radius: 0 8px 8px 0; }
  .upd-hdr { display: flex; gap: 6px; align-items: center; margin-bottom: 2px; }
  .upd-hdr .when { margin-left: auto; color: var(--faint); font-size: 11px; }
  .upd-body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .upd-list { display: grid; gap: 8px; }
  .upd-item { border-left: 3px solid var(--cyan); padding: 4px 10px; font-size: 13px; }
  .upd-item .when { font-size: 11px; color: var(--faint); }
  .member .doing.said { font-style: italic; }
  .feed-filter { display: flex; gap: 2px; }
  .feed-filter button { background: none; border: 1px solid transparent; border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .feed-filter button[aria-pressed="true"] { color: var(--green); border-color: var(--green-dim); background: var(--panel-2); }
  .act { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; font-size: 12px; color: var(--muted); padding: 1px 0; }
  .act .act-icon { font-family: var(--mono); font-weight: 700; color: var(--green); text-align: center; }
  .act code { color: var(--text); font-size: 11.5px; overflow-wrap: anywhere; }
  .act.bad .act-icon, .act.bad code, .bad-tag { color: var(--red); }
  .act .when { color: var(--faint); font-size: 11px; }
  .act-dot { width: 8px; height: 8px; border-radius: 50%; justify-self: center; align-self: center; }
  .act-text { min-width: 0; overflow-wrap: anywhere; }
  .linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--text); font-weight: 700; cursor: pointer; }
  .linkish:hover, .linkish:focus-visible { text-decoration: underline; }
  .msg .to .linkish { color: var(--muted); font-weight: 400; }
  .team-panel { margin-bottom: 10px; }
  #team { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .mini-stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); } .mini-stats b { color: var(--text); font-family: var(--mono); }
  .mini-msgs { display: grid; gap: 8px; max-height: 320px; overflow-y: auto; }
  .msg.with-you .body { border-left: 3px solid var(--red); }
  /* Person panel: tabs, and Chat as a messenger with the box pinned at the bottom. */
  .drawer-tabs { display: flex; gap: 4px; padding: 6px 12px; border-bottom: 1px solid var(--border); }
  .drawer-tabs button { background: none; border: 1px solid transparent; border-radius: 8px; padding: 4px 12px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .drawer-tabs button[aria-selected="true"] { color: var(--green); border-color: var(--green-dim); background: var(--panel-2); }
  .chat-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .chat-pane #p-banner:not(:empty) { padding: 10px 14px 0; display: grid; gap: 8px; max-height: 45%; overflow-y: auto; flex: none; }
  .block-card { border: 1px solid color-mix(in srgb, var(--red) 45%, transparent); background: color-mix(in srgb, var(--red) 7%, var(--panel)); border-radius: 10px; padding: 8px 10px; }
  .block-head { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; margin-bottom: 4px; }
  .block-head .btn { padding: 3px 10px; font-size: 12px; }
  .block-note { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
  .block-card.team { border-color: color-mix(in srgb, var(--amber) 45%, transparent); background: color-mix(in srgb, var(--amber) 6%, var(--panel)); }
  .block-who { font-size: 12px; color: var(--amber); margin-bottom: 4px; } .block-who.you { color: var(--red); font-weight: 600; }
  .card .waiting { font-size: 12px; color: var(--amber); margin-top: 4px; font-weight: 600; } .card .waiting.you { color: var(--red); }
  .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .thread-empty { margin: auto; max-width: 320px; text-align: center; color: var(--muted); font-size: 13px; }
  .bub { max-width: 86%; padding: 8px 11px; border-radius: 12px; font-size: 13.5px; border: 1px solid var(--border); }
  .bub.me { align-self: flex-end; background: color-mix(in srgb, var(--green) 14%, var(--panel)); border-color: color-mix(in srgb, var(--green) 35%, transparent); border-bottom-right-radius: 4px; }
  .bub.me.int { background: color-mix(in srgb, var(--red) 14%, var(--panel)); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
  .bub.them { align-self: flex-start; background: var(--panel-2); border-bottom-left-radius: 4px; }
  .bub.pending { color: var(--muted); font-style: italic; border-style: dashed; }
  .bub.pending .dots { display: inline-block; animation: pulse 1.2s infinite; }
  .bub-meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .bub-body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .drawer-composer { border-top: 1px solid var(--border); padding: 10px 12px 12px; background: var(--panel); display: grid; gap: 8px; }
  .drawer-composer textarea { resize: vertical; min-height: 44px; max-height: 40vh; }
  .composer-actions { display: flex; gap: 8px; align-items: center; font-size: 11px; }
  .composer-actions .hint { flex: 1; min-width: 0; line-height: 1.3; }
  .composer-actions .btn { flex: none; white-space: nowrap; }
  @media (max-width: 520px) { .composer-actions { flex-wrap: wrap; } .composer-actions .hint { flex-basis: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bub.pending .dots { animation: none; } }
  /* Charts */
  .section-head { display: flex; align-items: baseline; gap: 10px; margin: 4px 2px 10px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 10px; }
  .chart .chart-body { padding: 10px 14px 12px; }
  .chart-sub { font-size: 12px; color: var(--muted); margin-bottom: 6px; min-height: 16px; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .grid { stroke: var(--border); stroke-width: 1; }
  .chart .axis { stroke: var(--faint); stroke-width: 1; }
  .chart .tick { fill: var(--muted); font: 10px var(--mono); }
  .chart .lbl { fill: var(--text); font: 12px var(--sans); } .chart .lbl.num { font-family: var(--mono); font-weight: 700; }
  .chart .big { fill: var(--text); font: 700 22px var(--mono); }
  .chart .line { fill: none; stroke-width: 2; }
  .chart .area { fill-opacity: .12; }
  .chart .band { fill-opacity: .8; }
  .chart .forecast { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
  .chart .now { stroke: var(--faint); stroke-dasharray: 2 3; }
  .chart .avg { stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .chart .cbar.open { fill-opacity: .5; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .chart-legend b { color: var(--text); font-family: var(--mono); }
  .chart-empty { color: var(--muted); font-size: 13px; padding: 30px 0; text-align: center; }
  .kanban { display: grid; grid-template-columns: repeat(5, minmax(170px, 1fr)); gap: 10px; overflow-x: auto; }
  .col { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; min-height: 160px; display: flex; flex-direction: column; min-width: 0; }
  .col h3 { margin: 0; padding: 10px 12px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .col .cards { padding: 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-content: start; }
  /* Long paths and package names wrap inside the card instead of widening the column. */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; min-width: 0; overflow-wrap: anywhere; }
  .card .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .card .tt { font-weight: 600; font-size: 13px; margin: 2px 0 6px; }
  .card .who { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .card .note { font-size: 12px; color: var(--amber); margin-top: 4px; }
  .col.blocked h3 { color: var(--red); } .col.done h3 { color: var(--green); }
  /* Pixel portraits (18×28 art), scaled with crisp pixels. */
  .avatar { width: 27px; height: 42px; flex: none; image-rendering: pixelated; object-fit: contain; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--border); }
  .avatar.sm { width: 18px; height: 28px; border-radius: 4px; }
  .avatar.lg { width: 36px; height: 56px; }
  .avatar.you { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; border: 0; }
  .avatar.you.sm { width: 22px; height: 22px; font-size: 8px; }
  .avatar.you.hq { background: var(--faint); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .needs { position: sticky; top: 56px; z-index: 15; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; margin-bottom: 10px; border-radius: 10px;
    background: color-mix(in srgb, var(--red) 10%, var(--panel)); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); }
  .needs-title { font-weight: 700; color: var(--red); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; margin-right: 4px; }
  /* Two lines of each item; the full text is in the tooltip and in the person's panel. */
  .needs-item { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 4px 10px; font-size: 12px; cursor: pointer; max-width: 100%; text-align: left; overflow: hidden;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; white-space: normal; overflow-wrap: anywhere; }
  .needs-item.red { border-color: color-mix(in srgb, var(--red) 50%, transparent); } .needs-item.amber { border-color: color-mix(in srgb, var(--amber) 50%, transparent); }
  .viewtabs { display: flex; gap: 4px; }
  .viewtabs button { background: none; border: 1px solid transparent; border-radius: 8px; padding: 5px 12px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .viewtabs button[aria-selected="true"] { color: var(--green); border-color: var(--green-dim); background: var(--panel-2); }
  .office-host { position: relative; height: 100%; min-height: 320px; border-radius: 8px; overflow: hidden; background: var(--bg); touch-action: none; cursor: grab; }
  .office-host:active { cursor: grabbing; }
  .office-canvas { display: block; }
  button.card { text-align: left; width: 100%; cursor: pointer; font: inherit; color: inherit; }
  button.card:hover { border-color: var(--green-dim); }
  .banner { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .banner.red { border-color: color-mix(in srgb, var(--red) 50%, transparent); color: var(--red); } .banner.amber { border-color: color-mix(in srgb, var(--amber) 50%, transparent); color: var(--amber); }
  .wf { display: grid; gap: 3px; max-height: 260px; overflow-y: auto; }
  .wf-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-family: var(--mono); font-size: 11px; }
  .wf-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .wf-track { height: 8px; background: var(--panel-2); border-radius: 3px; overflow: hidden; } .wf-track i { display: block; height: 100%; background: var(--green); } .wf-track i.bad { background: var(--red); }
  .wf-ms { text-align: right; color: var(--muted); }
  .history { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 13px; }
  .btw { display: grid; gap: 6px; max-height: 300px; overflow-y: auto; margin-bottom: 8px; padding: 8px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; }
  .btw-msg { max-width: 88%; padding: 7px 10px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .btw-msg .faint { display: block; font-size: 10px; margin-top: 2px; }
  .btw-msg.me { justify-self: end; background: color-mix(in srgb, var(--violet) 22%, var(--panel)); border: 1px solid color-mix(in srgb, var(--violet) 40%, transparent); }
  .btw-msg.them { justify-self: start; background: var(--panel); border: 1px solid var(--border); }
  .btw-msg.thinking { color: var(--muted); font-style: italic; }
  .btw-msg .dots { display: inline-block; animation: pulse 1.2s infinite; }
  @media (prefers-reduced-motion: reduce) { .btw-msg .dots { animation: none; } }
  .team { display: grid; gap: 8px; }
  .member { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); cursor: pointer; text-align: left; width: 100%; }
  .member:hover { border-color: var(--green-dim); }
  .member .name { font-weight: 700; }
  .harness-pill { font-size: 10px; padding: 0 6px; vertical-align: 1px; } .member .role { color: var(--muted); font-size: 12px; }
  .member .doing { font-size: 12px; color: var(--text); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat { max-height: 520px; overflow-y: auto; display: grid; gap: 8px; padding: 12px 14px; }
  .chat-wrap { position: relative; }
