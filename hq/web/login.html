<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · RedPi HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/static/hq.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login { width: min(380px, 100%); padding: 26px 24px 22px; display: grid; gap: 14px; }
  .login .brand { font-size: 20px; text-align: center; }
  .login p { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
  .login label { display: grid; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .login .btn { justify-content: center; padding: 9px 14px; }
  .login .error-box:empty { display: none; }
  .foot { font-size: 11px; text-align: center; }
</style>
</head>
<body>
<main class="panel login">
  <div class="brand"><span class="r">Red</span><span class="p">Pi</span> <span class="hq">// HQ</span></div>
  <p id="lead">Sign in to see every RedPlan project on this machine.</p>
  <form id="form" class="hide" style="display:grid;gap:12px">
    <label>Username <input type="text" id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label>Password <input type="password" id="password" name="password" autocomplete="current-password" required></label>
    <div class="error-box" id="err" role="alert"></div>
    <button class="btn primary" id="go" type="submit">Sign in</button>
  </form>
  <div class="faint foot">powered by YITEC</div>
</main>
<script type="module" src="/static/login.js"></script>
</body>
</html>
