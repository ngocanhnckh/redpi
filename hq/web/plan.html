<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedPlan Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/static/hq.css">
<style>
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  .hero h1 { margin: 6px 0 8px; font-size: 26px; line-height: 1.25; }
  .hero .summary { color: var(--text); opacity: .9; max-width: 72ch; }
  .decision { position: sticky; top: 64px; }
  .panel-head .pin-toggle { padding: 4px 10px; font-size: 12px; }
  .decision textarea { min-height: 84px; resize: vertical; margin: 8px 0 10px; }
  .decision .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .versions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .versions a { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); }
  .versions a.cur { color: var(--green); border-color: var(--green-dim); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 26px 0 16px; overflow-x: auto; }
  .tabs button { background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--green); border-bottom-color: var(--green); }
  details.story { margin-bottom: 10px; }
  details.story > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  details.story > summary::-webkit-details-marker { display: none; }
  details.story > summary .chev { transition: transform .15s; color: var(--muted); font-family: var(--mono); }
  details.story[open] > summary .chev { transform: rotate(90deg); }
  .sid { font-family: var(--mono); color: var(--cyan); font-weight: 700; }
  .story-title { font-weight: 600; }
  .user-story { color: var(--muted); font-size: 13px; }
  .story-body { padding: 0 16px 14px 44px; }
  .acc { margin: 6px 0 12px; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .task { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; background: var(--panel-2); }
  .task.crit { border-color: color-mix(in srgb, var(--red) 55%, transparent); }
  .task .tid { font-family: var(--mono); font-weight: 700; color: var(--muted); }
  .task .tt { font-weight: 600; }
  .task .td { color: var(--text); opacity: .85; font-size: 13px; margin-top: 2px; }
  .task .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .task .est { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
  .gantt text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
  .gantt .label { fill: var(--text); font-family: var(--sans); font-size: 12px; }
  .gantt .grid { stroke: var(--border); }
  .gantt .bar { fill: var(--green-dim); } .gantt .bar.crit { fill: var(--red); }
  .gantt .slack { stroke: var(--faint); stroke-dasharray: 3 3; }
  .gantt .story-row { fill: var(--panel-2); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .legend i { display: inline-block; width: 18px; height: 8px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
  .waves { display: grid; gap: 8px; margin-top: 14px; }
  .wave { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px; align-items: start; }
  .wave .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .arch text { font-size: 12px; fill: var(--text); font-family: var(--sans); }
  .arch .kind { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
  .arch .edge { stroke: var(--faint); fill: none; stroke-width: 1.5; }
  .arch .elabel { font-family: var(--mono); font-size: 10px; fill: var(--muted); }
  .tech { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .tech .card { padding: 14px; }
  .tech .pkg { font-family: var(--mono); color: var(--green); font-weight: 700; }
  .tech dl { margin: 10px 0 0; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; }
  .tech dt { color: var(--muted); } .tech dd { margin: 0; overflow-wrap: anywhere; }
  .warn-list { margin: 0; padding-left: 18px; color: var(--amber); font-size: 13px; }
  .decision { max-height: calc(100vh - 80px); overflow-y: auto; }
  .harness-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); font-size: 13px; }
  .harness-bar label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  .harness-select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 12px; max-width: 100%; }
  .harness-select:focus { outline: 2px solid color-mix(in srgb, var(--green) 50%, transparent); }
  /* Review: highlights, badges, diagram pins, the comment editor, and the feedback list */
  mark.anno { background: color-mix(in srgb, var(--amber) 28%, transparent); color: inherit; border-bottom: 2px solid var(--amber); border-radius: 2px; cursor: pointer; }
  mark.anno.sent { background: color-mix(in srgb, var(--cyan) 18%, transparent); border-bottom-color: var(--cyan); }
  .anno-badge, .num { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; border: 0; background: var(--amber); color: #1a1200; font: 700 10px/1 var(--mono); flex: none; }
  .anno-badge { vertical-align: super; margin-left: 2px; cursor: pointer; }
  .anno-badge.sent, .sent > .fb-jump .num, .fb-item.sent .num, .pin.sent { background: var(--cyan); color: #00161d; }
  .diagram { position: relative; display: inline-block; }
  .diagram > svg { display: block; }
  .diagram.pinning { outline: 2px dashed var(--amber); outline-offset: 4px; border-radius: 6px; }
  /* Pan and zoom frame (panzoom.js) */
  .pz { position: relative; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); outline: none; }
  .pz:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .pz:has(.diagram.pinning) { outline: 2px dashed var(--amber); outline-offset: 2px; }
  .pz .diagram.pinning { outline: none; }
  .pz-stage { position: relative; overflow: hidden; height: 320px; touch-action: none; cursor: grab; border-radius: 0 0 8px 8px; }
  .pz-dragging .pz-stage, .pz-dragging .pz-stage * { cursor: grabbing !important; }
  .pz-stage > .diagram { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-select: none; }
  .pz .pin { transform: translate(-50%, -100%) scale(var(--pz-inv, 1)); transform-origin: 50% 100%; }
  .pz-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .pz-hint { flex: 1; min-width: 0; font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pz-tools { display: flex; gap: 4px; flex: none; }
  .pz-tools .btn { padding: 3px 9px; font-size: 12px; min-width: 30px; }
  .pz-zoom { font-family: var(--mono); min-width: 54px; }
  @media (max-width: 480px) { .pz-hint { display: none; } .pz-tools { margin-left: auto; } }
  .pz-expanded { position: fixed; inset: 12px; z-index: 45; display: flex; flex-direction: column; background: var(--bg); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .pz-expanded .pz-stage { flex: 1; height: auto !important; }
  body.pz-lock { overflow: hidden; }
  .arch .elabel { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  .diagram.pinning, .diagram.pinning * { cursor: crosshair; }
  .pin { position: absolute; transform: translate(-50%, -100%); min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px 12px 12px 2px; border: 2px solid var(--bg); background: var(--amber); color: #1a1200;
    font: 700 11px/1 var(--mono); cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.4); z-index: 2; }
  .pin:focus-visible, .anno-badge:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .row-hit { fill: transparent; } .edge-hit { stroke: transparent; stroke-width: 14; fill: none; }
  .flash { animation: flash 1.2s ease-out 1; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 70%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
  @media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 2px solid var(--amber); } }
  .sel-btn { position: fixed; z-index: 60; padding: 5px 11px; font-size: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .sel-btn[hidden] { display: none; }
  .composer-pop { position: fixed; z-index: 70; width: min(380px, calc(100vw - 16px)); padding: 12px; display: grid; gap: 8px; box-shadow: 0 16px 40px rgba(0,0,0,.45); }
  .cp-where { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .cp-quote { margin: 0; padding: 2px 0 2px 9px; border-left: 3px solid var(--amber); color: var(--muted); font-size: 13px; max-height: 84px; overflow-y: auto; }
  .cp-text { resize: vertical; min-height: 72px; }
  .cp-body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }
  .cp-row { display: flex; gap: 8px; align-items: center; }
  .cp-hint { font-size: 11px; }
  @media (max-width: 560px) { .composer-pop { left: 8px !important; right: 8px; top: auto !important; bottom: 8px; width: auto; } }
  .fb-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
  .fb-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
  .fb-list > .fb-item:not(:has(.fb-jump)) { display: flex; gap: 8px; padding: 8px; }
  .fb-jump { display: flex; gap: 8px; align-items: flex-start; text-align: left; background: none; border: 0; padding: 8px; cursor: pointer; width: 100%; color: inherit; font: inherit; min-width: 0; }
  .fb-jump:hover .fb-body { color: var(--green); }
  .fb-text { display: grid; gap: 2px; min-width: 0; }
  .fb-where { font: 11px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .fb-quote { font-size: 12px; font-style: italic; color: var(--muted); overflow-wrap: anywhere; }
  .fb-body { font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .fb-item.orphan .fb-where::after { content: " · not found in this version"; color: var(--amber); }
  .fb-empty { font-size: 13px; color: var(--muted); padding: 10px; border: 1px dashed var(--border); border-radius: 8px; margin-bottom: 12px; }
  .icon-btn { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 8px 10px; font-size: 14px; }
  .icon-btn:hover { color: var(--green); }
  .fb-overall { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .fb-overall textarea { min-height: 60px; margin: 0 0 10px; font-weight: 400; }
  .tab-count { display: inline-grid; place-items: center; min-width: 17px; height: 17px; margin-left: 4px; border-radius: 9px; background: var(--amber); color: #1a1200; font: 700 10px/1 var(--mono); }
  .prev-fb { margin-top: 12px; font-size: 13px; } .prev-fb summary { cursor: pointer; color: var(--muted); margin-bottom: 8px; }
  .changes-list { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
  @media (max-width: 900px) { .hero { grid-template-columns: 1fr; } .decision { position: static; max-height: none; } .story-body { padding-left: 16px; } }
  @media (max-width: 560px) { .task { grid-template-columns: 1fr; } .task .est { text-align: left; } }
</style>
</head>
<body>
<header class="top">
  <span class="brand"><span class="r">Red</span><span class="p">Plan</span> <span class="hq">// HQ</span></span>
  <span class="crumbs" id="crumbs"></span>
  <a class="btn" href="/">All projects</a>
  <span class="account" id="account"></span>
</header>
<main class="wrap" id="app"><div class="empty">Loading plan…</div></main>
<script type="module" src="/static/plan.js"></script>
</body>
</html>
